<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b23" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  {/* Background */}
  <rect width="600" height="750" fill="url(#bgGrad)" />
  <circle cx="300" cy="270" r="260" fill="url(#glowGrad)" />

  {/* Decorative Subtle Circles */}
  <circle cx="300" cy="270" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="300" cy="270" r="195" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.5" />

  {/* Avatar Silhouette */}
  <g fill="url(#avatarGrad)">
    {/* Head */}
    <circle cx="300" cy="225" r="75" />
    
    {/* Shoulders & Torso */}
    <path d="M 175 440 C 175 345, 230 330, 300 330 C 370 330, 425 345, 425 440 C 425 470, 425 510, 425 510 L 175 510 Z" />
  </g>

  {/* Wellness Leaf Accent */}
  <g transform="translate(276, 545)" fill="#34d399" opacity="0.95">
    <path d="M 24 0 C 12 12, 0 24, 0 36 C 0 49, 11 60, 24 60 C 37 60, 48 49, 48 36 C 48 24, 36 12, 24 0 Z M 24 52 C 16 52, 8 44, 8 36 C 8 28, 16 20, 24 10 C 32 20, 40 28, 40 36 C 40 44, 32 52, 24 52 Z" />
    <path d="M 24 18 L 24 45" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  </g>

  {/* Placeholder Label */}
  <text x="300" y="640" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="3" opacity="0.95">WELLNESS COACH</text>
  <text x="300" y="668" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" letter-spacing="2" opacity="0.75">PROFILE PLACEHOLDER</text>
</svg>
